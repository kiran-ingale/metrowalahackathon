[project]
name = "unstuck-backend"
version = "0.1.0"
description = "Backend services for the Unstuck learning mentor."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "counterexample_eval: deterministic known-wrong candidate evaluation harness",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
